[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megamaid"
dynamic = ["version"]
description = "Polite, resumable web scraper scaffolding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately empty. Both consumers install an extra:
#   [mcp]     — the MCP server, installed inside Claude Code's 30s connect budget
#   [scraper] — scaffolded project venvs, where scraping actually happens
dependencies = []

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.0.0",
    "httpx>=0.27",
    "pydantic>=2.5",
]
# The URL-scoped CLI commands (recon, map, init) — runnable from the state venv
# with no project and no browser. Project-scoped commands (suck, status, diff,
# export) need the project's own targets/ package and live in [scraper].
cli = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.5",
]
scraper = [
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
    "click>=8.1",
    "httpx>=0.27",
    "trafilatura>=2.0",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.6",
]

[project.scripts]
megamaid = "megamaid.cli:cli"
megamaid-mcp = "megamaid_mcp.server:main"

[tool.setuptools.dynamic]
version = { file = ".claude-plugin/VERSION.txt" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["megamaid*", "megamaid_mcp*"]
