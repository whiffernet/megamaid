name: release-tag
on:
  push:
    branches: [main]
concurrency:
  group: tagging
  cancel-in-progress: false
permissions:
  contents: write       # push the tag
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Cut the tag the repo declares
        run: |
          # VERSION.txt is the single source of truth; scripts/bump_version.py
          # writes it and tests/test_version_release_gate.py refuses to let a
          # shipped change through without it moving. Cutting from it here is
          # what keeps `git checkout v1.2.3` and VERSION.txt in agreement.
          VERSION=$(tr -d '[:space:]' < .claude-plugin/VERSION.txt)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION.txt holds '$VERSION', which is not bare semver"; exit 1;;
          esac

          NEXT="v$VERSION"

          # Idempotent, and it is also how a manual tag wins: if the tag already
          # exists there is nothing to do, whoever created it. Filtered to v*
          # because `claude plugin tag` writes megamaid--v<version> tags too.
          if [ -n "$(git tag --list "$NEXT")" ]; then
            echo "$NEXT already exists — nothing to cut"
            exit 0
          fi

          git tag "$NEXT"
          git push origin "$NEXT"
          echo "Cut $NEXT"
