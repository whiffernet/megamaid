version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  labels:
  - dependencies
  groups:
    github-actions:
      patterns:
      - '*'
  cooldown:
    default-days: 7
# The launcher pip-installs this package's [mcp,cli] extras at runtime with no
# lockfile, so the declared ranges in pyproject.toml are the only thing keeping
# that install current. Dependabot covering them is what the spec leans on when
# it accepts an unpinned runtime install.
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  labels:
  - dependencies
  groups:
    python-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
